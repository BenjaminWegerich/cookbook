<!--
  Cookbook app icon (browser tab, bookmark, home screen).

  Symbol: Material Symbols, Rounded style, "menu_book_2" ("Menu Book 2") — the
  notebook with cutlery on its cover. It is the app's brand mark and, unlike the
  skillet it replaces, matches no in-app UI symbol: every glyph in
  apps/web/src/components/icons.tsx stays a separate, weight-400 symbol.

  Source: google/material-design-icons,
  symbols/web/menu_book_2/materialsymbolsrounded/menu_book_2_24px.svg
  Settings: weight 400 (the unprefixed file is the set's weight-400 drawing),
  grade 0, optical size 24, unfilled (fill 0). The path data below is that
  file's `d` attribute, verbatim. This file is the one symbol that does not live
  in apps/web/src/components/icons.tsx, but it follows the same rule as every
  in-app icon (docs/CODING_CONVENTIONS.md, "One symbol library for every icon"):
  Material Symbols, Rounded, weight 400 — so the app icon is no longer the
  weight exception the previous skillet icon had to be.

  Coordinates: the Material file uses viewBox "0 -960 960 960", i.e. y runs
  upwards from 0 to -960. The inner transform shifts the glyph by +960 on y
  into the 0..960 box used here; the outer transform centres its ink box
  (120..799 x 80..879) in the tile, its longer side scaled to 728 units, so the
  tile keeps a 116-unit margin above and below the glyph.

  Colours are the app's design tokens (apps/web/src/styles/tokens.css): the
  page background #faf5ec for the paper tile and the clay accent #b85c38 for
  the glyph. The tile keeps the mark readable on light and on dark browser
  chrome. (The tokens are named here without their leading dashes because an
  XML comment must not contain a double hyphen.)
-->
