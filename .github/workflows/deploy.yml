name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant the workflow write access to Pages and contents (for deployments).
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; in-progress runs are cancelled on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Google OAuth client ID, the Keep gateway URL and the export host URL
      # are public data (all three ship in the browser), but they are kept out of
      # the repository: the CI build reads them from the repository variables set
      # in the GitHub settings. An unset VITE_KEEP_GATEWAY_URL simply switches
      # Keep off; an unset VITE_EXPORT_HOST_URL falls back to Drive export links.
      - name: Configure build environment
        run: |
          : > apps/web/.env
          if [ -n "${{ vars.VITE_GOOGLE_CLIENT_ID }}" ]; then
            echo "VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}" >> apps/web/.env
          fi
          if [ -n "${{ vars.VITE_KEEP_GATEWAY_URL }}" ]; then
            echo "VITE_KEEP_GATEWAY_URL=${{ vars.VITE_KEEP_GATEWAY_URL }}" >> apps/web/.env
          fi
          if [ -n "${{ vars.VITE_EXPORT_HOST_URL }}" ]; then
            echo "VITE_EXPORT_HOST_URL=${{ vars.VITE_EXPORT_HOST_URL }}" >> apps/web/.env
          fi

      - name: Typecheck core module
        run: npm run typecheck --workspace @cookbook/core

      - name: Test core module
        run: npm run test --workspace @cookbook/core

      - name: Build web app
        run: npm run build --workspace @cookbook/web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
